default_provider: openai_1k

providers:
  gemini:
    enabled: true
    api_base: "${YUNWU_GEMINI_API_BASE}"
    api_key: "${YUNWU_API_KEY}"
    model: "gemini-2.5-flash-image"
    timeout: 60

  openai_1k:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    # 稳定推荐：/images/edits multipart，上传图片字段为 image[]
    model: "gpt-image-2-1k"
    request_mode: image_edits
    resolution: "1k"
    size: "original"
    timeout: 600

  openai_pro4k:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    # 支持 1K/2K/4K；4K 遇到 502/503/504 时自动按 2K 重试
    model: "gpt-image2-Pro4K"
    request_mode: image_edits
    default_resolution: "2k"
    size: "original"
    downgrade_4k_on_gateway_error: true
    timeout: 600

  openai_chat:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    # 仅 1K 生图，对话协议 /chat/completions
    model: "gpt-image-2"
    request_mode: chat_completions
    size: "original"
    timeout: 600

  seededit:
    enabled: true
    api_base: "${YUNWU_API_BASE}"
    api_key: "${YUNWU_API_KEY}"
    model: "doubao-seededit-3-0-i2i-250628"
    timeout: 120

  tongyi:
    enabled: false
    api_base: "${TONGYI_API_BASE}"
    api_key: "${DASHSCOPE_API_KEY}"
    model: "wanx-image-edit-plus"

  flux:
    enabled: false
    api_base: "${RELAY_API_BASE}"
    api_key: "${FLUX_API_KEY}"
    model: "flux-kontext-pro"

routing:
  text_edit: openai_1k
  watermark_remove: openai_1k
  reference_edit: openai_1k
  iterative_edit: openai_1k
  default: openai_1k

fallback:
  enabled: false
  chain:
    gemini:
      - openai_1k
    openai_1k:
      - openai_pro4k
    openai_pro4k:
      - openai_1k
    openai_chat:
      - gemini
  max_retries: 1

session:
  max_context_turns: 10
