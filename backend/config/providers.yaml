default_provider: openai_1k

providers:
  gemini:
    enabled: true
    api_base: "${YUNWU_GEMINI_API_BASE}"
    api_key: "${YUNWU_API_KEY}"
    model: "gemini-2.5-flash-image"
    timeout: 60

  openai_1k:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    # 稳定推荐：/images/edits multipart，上传图片字段为 image[]
    model: "gpt-image-2-1k"
    request_mode: image_edits
    resolution: "1k"
    supported_resolutions: ["1k"]
    price_per_image: 0.06
    size: "original"
    timeout: 600

  # TY API：1K 高稳定模型。需要启用时，把 routing 中对应任务改为 openai_sunburst_1k。
  openai_sunburst_1k:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-image-2.5-sunburst-1k"
    request_mode: image_edits
    resolution: "1k"
    supported_resolutions: ["1k"]
    price_per_image: 0.06
    size: "original"
    timeout: 600

  openai_flare_1k:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-image-2.5-flare-1k"
    request_mode: image_edits
    resolution: "1k"
    supported_resolutions: ["1k"]
    price_per_image: 0.06
    size: "original"
    timeout: 600

  openai_reverse_1k:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-image-2-逆向"
    request_mode: image_edits
    resolution: "1k"
    supported_resolutions: ["1k"]
    price_per_image: 0.04
    size: "original"
    timeout: 600

  openai_reverse_4k:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-image-2.5-逆向"
    request_mode: image_edits
    default_resolution: "4k"
    supported_resolutions: ["1k", "2k", "4k"]
    price_per_image: 0.04
    size: "original"
    timeout: 600

  openai_4k:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-image-2-4k"
    request_mode: image_edits
    default_resolution: "4k"
    supported_resolutions: ["1k", "2k", "4k"]
    price_per_image: 0.12
    size: "original"
    timeout: 600

  openai_flare_4k_max:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-image-2.5-flare-4k-max"
    request_mode: image_edits
    default_resolution: "4k"
    supported_resolutions: ["4k"]
    price_per_image: 0.30
    size: "original"
    timeout: 600

  openai_sunburst_4k_max:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-image-2.5-sunburst-4k-max"
    request_mode: image_edits
    default_resolution: "4k"
    supported_resolutions: ["4k"]
    price_per_image: 0.40
    size: "original"
    timeout: 600
    # TY API 文档建议省略 quality；确认中转站支持后再取消注释。
    # extra_payload:
    #   quality: "high"

  # TY API：4K 高质量模型。默认使用 4K，网关繁忙时自动降级到 2K。
  openai_4k_high:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-image-2-4k-high"
    request_mode: image_edits
    default_resolution: "4k"
    supported_resolutions: ["4k"]
    price_per_image: 0.20
    size: "original"
    downgrade_4k_on_gateway_error: true
    timeout: 600

  openai_pro4k:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    # 支持 1K/2K/4K；4K 遇到 502/503/504 时自动按 2K 重试
    model: "gpt-image2-Pro4K"
    request_mode: image_edits
    default_resolution: "2k"
    size: "original"
    downgrade_4k_on_gateway_error: true
    timeout: 600

  openai_chat:
    enabled: true
    api_base: "${OPENAI_BASE_URL}"
    api_key: "${OPENAI_API_KEY}"
    # 仅 1K 生图，对话协议 /chat/completions
    model: "gpt-image-2"
    request_mode: chat_completions
    size: "original"
    timeout: 600

  seededit:
    enabled: true
    api_base: "${YUNWU_API_BASE}"
    api_key: "${YUNWU_API_KEY}"
    model: "doubao-seededit-3-0-i2i-250628"
    timeout: 120

routing:
  text_edit: openai_1k
  watermark_remove: openai_1k
  reference_edit: openai_1k
  iterative_edit: openai_1k
  default: openai_1k

image_model_picker:
  providers:
    - openai_reverse_1k
    - openai_reverse_4k
    - openai_1k
    - openai_sunburst_1k
    - openai_flare_1k
    - openai_4k
    - openai_4k_high
    - openai_flare_4k_max
    - openai_sunburst_4k_max

fallback:
  enabled: false
  chain:
    gemini:
      - openai_1k
    openai_1k:
      - openai_sunburst_1k
    openai_sunburst_1k:
      - openai_1k
    openai_4k_high:
      - openai_1k
    openai_pro4k:
      - openai_1k
    openai_chat:
      - gemini
  max_retries: 1

session:
  max_context_turns: 10
